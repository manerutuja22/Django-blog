{% extends 'base.html' %}

{% block content %}

<div class="row">

    <!-- Left Sidebar -->
    <!-- load the sidebar here -->
    {% include 'dashboard/sidebar.html' %}

    <!-- Right Sidebar -->
    <div class="col-md-9">
        <spam>Logged in as <b>{{ user }}<b></spam>
        <div class="row">
        
            <!-- Categories Card -->
            <div class="col-md-6">

                <div class="card border-default mb-3">

                    <div class="card-header text-center text-uppercase font-weight-bold">
                        All Categories
                    </div>

                    <div class="card-body text-dark">
                        <h5 class="card-title text-center">
                            {{ category_count }}
                        </h5>
                    </div>

                </div>

            </div>


            <!-- Posts Card -->
            <div class="col-md-6">

                <div class="card border-default mb-3">

                    <div class="card-header text-center text-uppercase font-weight-bold">
                        All Posts
                    </div>

                    <div class="card-body text-dark">
                        <h5 class="card-title text-center">
                            {{ blogs_count }}
                        </h5>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
