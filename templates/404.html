{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 - Kuch To Gadbad Hai!</title>

    <link
        href="https://getbootstrap.com/docs/4.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css?family=Playfair+Display:700,900"
        rel="stylesheet"
    >

    <style>

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background: #f8f9fa;
        }

        .error-container {
            text-align: center;
            padding: 40px 20px;
        }

        .error-code {
            font-family: "Playfair Display", Georgia, serif;

            font-size: 150px;
            font-weight: 900;

            line-height: 1;

            color: #343a40;

            margin-bottom: 20px;
        }

        .error-title {
            font-family: "Playfair Display", Georgia, serif;

            font-size: 42px;

            margin-bottom: 15px;

            color: #212529;
        }

        .error-message {
            font-size: 18px;

            color: #6c757d;

            margin-bottom: 30px;
        }

        .home-btn {
            padding: 12px 25px;

            border-radius: 5px;

            text-decoration: none;

            background: #ffc107;

            color: #212529;

            font-weight: bold;

            transition: 0.3s;
        }

        .home-btn:hover {
            background: #e0a800;

            color: #212529;

            text-decoration: none;
        }

        .emoji {
            font-size: 60px;

            margin-bottom: 10px;
        }

    </style>

</head>


<body>

    <div class="container">

        <div class="error-container">

            <div class="emoji">
                🤦‍♀️
            </div>

            <div class="error-code">
                404
            </div>

            <h1 class="error-title">
                Kuch To Gadbad Hai!
            </h1>

            <p class="error-message">
                Oops! The page you're looking for doesn't exist
                or the URL might be wrong.
            </p>

            <a
                href="/"
                class="home-btn"
            >
                ← Go Back Home
            </a>

        </div>

    </div>

</body>

</html>
